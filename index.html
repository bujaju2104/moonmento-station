<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>문멘토 중개 AI · 역세권 지도와 중개 실무 도구</title>
<meta name="description" content="공인중개사를 위한 역세권 실거래 지도와 매물 소개글·상담·계약 일정 AI 도구.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand">문멘토 중개 AI<small>공인중개사 실무 앱 · MOONMENTO PROPERTY</small></div>
  <div class="contact">문멘토프라퍼티<br><a href="tel:01063361828">010.6336.1828</a> · <a href="tel:01043365038">010.4336.5038</a></div>
</header>
<nav class="views" role="tablist" aria-label="메뉴">
  <button type="button" role="tab" data-view="home" class="on">홈</button>
  <button type="button" role="tab" data-view="map">역세권 지도</button>
  <button type="button" role="tab" data-view="listings">매물</button>
  <button type="button" role="tab" data-view="cust">손님</button>
  <button type="button" role="tab" data-view="contracts">계약·달력</button>
  <button type="button" role="tab" data-view="tools">AI 도구</button>
  <button type="button" role="tab" data-view="policy">정권별 대책</button>
</nav>

<div class="layout" id="view-map">
  <section class="mapwrap">
    <div class="searchbar">
      <input id="q" type="search" placeholder="역 이름이나 아파트 이름 (예: 신당역, 남산타운)" autocomplete="off" aria-label="역 또는 아파트 검색">
      <div id="sugg" class="sugg" hidden></div>
    </div>
    <div id="map" class="map" aria-label="서울 지하철 노선과 역 지도"></div>
    <div class="maptools">
      <div class="seg" role="group" aria-label="역세권 반경">
        <button type="button" data-r="250">250m</button>
        <button type="button" data-r="500" class="on">500m</button>
        <button type="button" data-r="1000">1km</button>
      </div>
      <button type="button" id="lineBtn" class="tool">노선 보기</button>
      <button type="button" id="seoulBtn" class="tool">서울 전체</button>
    </div>
    <div id="linePanel" class="linepanel" hidden></div>
    <div id="mapMsg" class="mapmsg" hidden></div>
  </section>

  <aside class="panel" id="panel" aria-live="polite"></aside>
</div>

<main id="view-tools" class="toolsview" hidden></main>
<main id="view-home" class="toolsview" hidden></main>
<main id="view-listings" class="toolsview wide" hidden></main>
<main id="view-cust" class="toolsview" hidden></main>
<main id="view-contracts" class="toolsview" hidden></main>
<main id="view-calc" class="toolsview" hidden></main>
<main id="view-policy" class="toolsview" hidden></main>

<div id="sheet" class="scrim" hidden></div>

<footer class="foot">
  <p>실거래: <span id="srcRt">국토교통부 아파트 매매 실거래가</span>. 취소 거래는 빠져 있고, 계약 후 신고까지 시차가 있어 최근 거래는 늘어날 수 있어요. 손님 안내 전에는 <a href="https://rt.molit.go.kr/" target="_blank" rel="noopener">국토부 원본</a>으로 확인해 주세요.</p>
  <p>지하철역·노선: © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a> (ODbL). 역까지 거리는 직선거리이고, 도보 시간은 분당 80m로 계산했어요.</p>
  <p><button type="button" id="geoExport" class="linkbtn">찾은 단지 위치 내보내기</button></p>
</footer>

<script src="app.js"></script>
<script src="tools.js"></script>
<script src="work.js"></script>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=6a51434d9608eb202880ac7de2dd73ad&libraries=services&autoload=false" onerror="window.MM&&MM.kakaoFailed()"></script>
<script>if(window.kakao&&kakao.maps){kakao.maps.load(function(){MM.start()})}else{window.MM&&MM.kakaoFailed()}</script>
</body>
</html>
